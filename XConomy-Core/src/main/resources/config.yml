#UUID 模式：Default Online Offline SemiOnline
#Default 模式会自动识别玩家 UUID（支持 GeyserMC）
#Online 模式适用于开启正版验证的服务器（支持 Yggdrasil）
#Offline 模式不支持忽略用户名大小写
#如果使用 floodgate(GeyserMC) 且 username-prefix 留空，请使用 SemiOnline 模式
UUID-mode: Default
#数据转换模式下，可使用 /xconomy 从其他基于 Vault 的插件导入数据
#冲突的数据将被跳过，导入的数据将保存在 XConomy/importdata/data.yml 中
#该模式下 XConomy 不会正常启动
#转换完成后请检查数据并关闭该模式
Importdata-mode: false


#设置
Settings:
  #可选：Chinese ChineseTW English French Spanish Russian Turkish Japanese German
  #Indonesia Portuguese Italian
  language: Chinese
  #是否检查新版本
  check-update: true
  #TOP10 与服务器总余额的刷新间隔（秒）
  refresh-time: 300
  #设为 true 时，XConomy 会注册以下指令：
    # - economy
    # - eco
    # - ebalancetop
    # - ebaltop
    # - eeconomy
  #请注意：如果服务器安装了 Essentials
  #XConomy 会接管以上指令。
  eco-command: true
  #XConomy 将禁用 Essentials 的经济功能。
  #仅禁用经济功能。
  disable-essentials: true
  #初始余额
  initial-bal: 0
  #pay 指令收取的手续费（0.5 表示 50%，1 表示 100%）
  payment-tax: 0
  #排行榜显示数量（最大 100）
  ranking-size: 10
  #每页显示的行数（排行榜与帮助菜单）
  lines-per-page: 5
  #如需直接修改数据库中的数据，建议开启
  #关闭缓存后不支持异步保存数据
  #关闭缓存会增加数据库压力
  disable-cache: false
  #是否保存交易记录
  #仅支持 MySQL
  transaction-record: true
  #记录玩家离线期间的 pay 交易信息
  #玩家重新登录时会收到提示
  #需先开启 transaction-record
  offline-pay-transfer-tips: false
  #忽略玩家名大小写
  username-ignore-case: false
  #拥有权限 'xconomy.admin.hidden' 的玩家会从 baltop 中隐藏
  #（同时也会从 TAB 列表中隐藏，该行为始终生效）
  hidden-in-baltop: false


#可解决部分插件需要创建非玩家账户的问题，例如 Factions
#==========================================================================================
#默认支持的插件（无需开启非玩家账户）
#Towny
#==========================================================================================
#非玩家账户数据不与 BC 同步
non-player-account:
  #是否启用非玩家账户
  enable: false
  #若账户名包含白名单中的字段，则识别为非玩家账户
  #否则识别为玩家账户
  #若玩家名包含白名单中的字段，将拒绝其进入服务器
  #该功能可减少从数据库读取数据的次数
  whitelist:
    #是否启用白名单
    enable: false
    fields-list:
      - tax
      - nation-


#货币显示
Currency:
  singular-name: dollar
  plural-name: dollars
  #余额是否为整数
  integer-bal: false
  #多余小数位的取整方式
  #0 表示向下取整，1 表示向上取整
  rounding-mode: 0
  thousands-separator: ','
  #%format_balance% 表示格式化后的余额
  display-format: '%balance% %currencyname%'
  #最大金额（默认最大）
  max-number: '10000000000000000'
  format-balance:
    1000: k
    1000000: m


#SyncData 设置（跨服同步 / 跨服转账提示）
#使用 Redis 作为跨服通道，无需在 Velocity / BungeeCord 代理端安装插件
#离线转账提示依赖 MySQL 的交易记录功能
SyncData:
  #是否开启多服务器之间的数据同步
  enable: false
  #跨服通道，目前仅支持 Redis
  #需要 'slf4j' 依赖
  #可与 LiuChat 共用同一 Redis，XConomy 使用 db-index 指定的库与独立频道，互不冲突
  channel-type: Redis
  #服务器 ID，需要同步的服务器之间保持 ID 和 MySQL 设置一致
  sign: aa


#LiuChat 集成（跨服转账提示的优先方案）
#需要每个子服都安装 LiuChat，并开启其跨服功能
#LiuChat 可用时优先使用其私密投递，只把提示发给收款玩家；
#不可用时自动退回上方 SyncData(Redis) 内置跨服通道
LiuChat:
  #当收款玩家不在本服时，通过 LiuChat 私密投递把转账提示直达收款玩家
  #设为 false 可关闭
  cross-server-pay-tips: true
  #仅在收款玩家确实在线于其他服务器时才发送
  #（依赖 LiuChat 的在线列表；读取不到列表时仍会发送）
  tip-only-online: true
  #提示格式，支持 & 颜色代码
  #占位符：%player% 付款人，%target% 收款人，%amount% 转账金额
  pay-tip-format: '&8[&b跨服转账&8] &f%player% &7向你转账了 &a%amount%'


#财富税（每日对超额金币征税并销毁，回收通胀）
#多台子服共用同一 MySQL 时，依赖数据库保证「每天只结算一次」
WealthTax:
  #是否开启财富税
  enable: false
  #本服唯一标识，用于下方 executor 指定由哪台子服结算
  #留空表示不参与 executor 匹配
  server-id: ''
  #仅当本服 server-id 等于该值时才会执行结算；留空表示任意子服均可执行
  #建议指定为装有 Residence 的子服（如 99），以便把领地银行一并计税
  executor: ''
  #生效日期（yyyy-MM-dd）。留空表示立即生效，可用于公告后的缓冲期
  effective-date: ''
  #每日结算时间（服务器本地时间，HH:mm）
  time: '00:00'
  #起征点：合并后的财富高于该值才征税
  threshold: 50000000
  #每日税率，0.005 = 0.5%
  rate: 0.005
  #计税方式：full = 对全部财富征税；excess = 仅对超出起征点的部分征税
  basis: full
  #是否把 Residence（领地）银行余额计入玩家财富
  #需要服务端安装 Residence，二者兼任运行时自动生效
  include-residence-bank: true
  #结算后是否全服公告
  broadcast: true
  #税款去向：true = 直接销毁；false = 存入下方账户
  destroy: true
  #destroy 为 false 时，税收入账的账户名
  account: ''


#线程设置
Thread:
  #设置 CompletableFuture 的超时时间
  #单位为秒
  future-timeout: 3


#区域线程设置（仅对 Folia 服务器有效）
Region-Thread:
  #执行同步线程时，会在下方指定范围内随机选取一个坐标执行
  world: world
  range-x: 1024
  range-y: 1024
