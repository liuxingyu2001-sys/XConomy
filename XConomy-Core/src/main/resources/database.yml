Settings:
  #存储类型：SQLite MySQL MariaDB
  #MariaDB 需要安装 DatabaseDrivers
  storage-type: SQLite
  #是否使用连接池
  #需要 'slf4j' 依赖
  #最低要求 Java 11
  usepool: false


#SQLite 设置
SQLite:
  #路径为文件夹地址
  path: Default


#MySQL 设置
MySQL:
  host: localhost
  port: 3306
  user: root
  pass: root
  database: data
  #自动添加 "_"，可使用 %sign% 表示服务器 ID（SyncData 设置）
  table-suffix: ''
  property:
    usessl: false
    encoding: utf8
    timezone: ''
    allowPublicKeyRetrieval: false


#连接池设置
Pool-Settings:
  maximum-pool-size: 10
  minimum-idle: 10
  maximum-lifetime: 180000
  idle-timeout: 60000


#Redis 设置
Redis:
  host: localhost
  port: 6379
  db-index: 1
  duration: 1000
  pool-settings:
    max-total: 20
    max-idle: 20
    min-idle: 0
  auth:
    user: ''
    pass: ''
